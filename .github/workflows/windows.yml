name: hostsmith-ci

on: [push, pull_request]

jobs:
  linux-tests:
    name: Engine tests, lint and interface build (Linux, fast feedback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Interface build (Vite production build)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Engine tests (all crates)
        run: cargo test --workspace
      - name: Clippy (workspace, strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows:
    name: Windows build gate (compile the Tauri shell on the target platform)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build interface (produces ui/dist for the Tauri build)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Engine tests
        run: cargo test --workspace
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile the Tauri shell
        working-directory: src-tauri
        run: cargo check
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the desktop bundle (NSIS installer)
        working-directory: src-tauri
        run: cargo tauri build
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hostsmith-workshop-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
